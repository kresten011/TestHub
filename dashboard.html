<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TestHub - Dashboard</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

<div class="app-shell">

  <aside class="sidebar">

    <div class="sidebar-brand">

      <div class="brand-mark">
        T
      </div>

      <span>
        Test<span class="brand-blue">Hub</span>
      </span>

    </div>


    <nav>

      <a
        href="dashboard.html"
        class="nav-link active"
      >
        <span>⌂</span>
        Dashboard
      </a>

      <a
        href="exams.html"
        class="nav-link"
      >
        <span>□</span>
        Exams
      </a>

      <a
        href="results.html"
        class="nav-link"
      >
        <span>◇</span>
        Results
      </a>

      <a
        href="profile.html"
        class="nav-link"
      >
        <span>•</span>
        Profile
      </a>

    </nav>


    <button
      class="logout-btn"
      data-logout
    >
      <span>↪</span>
      Log Out
    </button>

  </aside>


  <main class="main-content">

    <header class="topbar">

      <div>

        <span class="eyebrow">
          YOUR LEARNING JOURNEY
        </span>

        <h1 id="greeting">
          Hello!
        </h1>

        <p class="page-subtitle">
          Good luck on your exams! Remember to stay honest and do your best.
        </p>

      </div>


      <a
        href="profile.html"
        class="avatar-link"
      >
        <img
          id="topAvatar"
          class="avatar"
          src=""
          alt="Profile"
        >
      </a>

    </header>


    <!-- STUDENT DASHBOARD -->

    <section
      id="studentDashboard"
      class="dashboard-grid"
    >

      <article class="card wide">

        <div class="card-title">

          <h3>
            Available Exams
          </h3>

          <a href="exams.html">
            View all
          </a>

        </div>

        <div id="availableExams"></div>

      </article>


      <article class="card">

        <h3>
          Completed Exams
        </h3>

        <div
          class="stat-number"
          id="completedCount"
        >
          0
        </div>

      </article>


      <article class="card">

        <h3>
          Exam This Week
        </h3>

        <div id="weekExam"></div>

      </article>


      <article class="card wide">

        <div class="card-title">

          <h3>
            Recent Results
          </h3>

          <a href="results.html">
            View all
          </a>

        </div>

        <div id="recentResults"></div>

      </article>

    </section>


    <!-- TEACHER DASHBOARD -->

    <section
      id="teacherDashboard"
      class="hidden"
    >

      <article class="card">

        <div class="card-title">

          <h3>
            Created Exams
          </h3>

          <a href="exams.html">
            Create Exam
          </a>

        </div>

        <div id="teacherExams"></div>

      </article>

    </section>

  </main>

</div>


<script src="js/app.js"></script>

</body>
</html>
